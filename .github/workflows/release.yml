name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.rust_target }}
    runs-on: ubuntu-latest
    # mips/mipsel-unknown-linux-musl currently have no prebuilt std for
    # stable Rust (upstream gap, not an issue with this workflow) — let
    # those two legs fail without blocking the release for architectures
    # that do build. Remove this once upstream ships prebuilt artifacts
    # for either target again.
    continue-on-error: ${{ matrix.arch == 'mips' || matrix.arch == 'mipsel' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 — covers aarch64_cortex-a53, aarch64_cortex-a72, etc.
          - rust_target: aarch64-unknown-linux-musl
            arch: aarch64
            openwrt_arch: aarch64_cortex-a53
            build_std: false

          # x86_64 — PC Engines APU, Protectli, VM builds
          - rust_target: x86_64-unknown-linux-musl
            arch: x86_64
            openwrt_arch: x86_64
            build_std: false

          # ARMv7 hard-float — covers arm_cortex-a7, arm_cortex-a9, arm_cortex-a15
          - rust_target: armv7-unknown-linux-musleabihf
            arch: arm_cortex-a7
            openwrt_arch: arm_cortex-a7_neon-vfpv4
            build_std: false

          # ARMv6 soft-float — older devices (arm_arm1176jzf-s_vfp)
          - rust_target: arm-unknown-linux-musleabi
            arch: arm_arm1176jzf-s
            openwrt_arch: arm_arm1176jzf-s_vfp
            build_std: false

          # MIPS little-endian — TP-Link, D-Link, many budget routers.
          # Stable Rust ships no prebuilt std for this target (demoted to
          # tier 3: rust-lang/rust#115238) — rebuild std from source on
          # nightly instead via `-Z build-std` (see GNUmakefile).
          - rust_target: mipsel-unknown-linux-musl
            arch: mipsel
            openwrt_arch: mipsel_24kc
            build_std: true

          # MIPS big-endian — some Atheros-based routers. Same tier-3 gap
          # as mipsel above.
          - rust_target: mips-unknown-linux-musl
            arch: mips
            openwrt_arch: mips_24kc
            build_std: true

          # RISC-V 64-bit — sifiveu, starfive (growing SBC-class hardware)
          - rust_target: riscv64gc-unknown-linux-musl
            arch: riscv64
            openwrt_arch: riscv64_generic
            build_std: false

    steps:
      - uses: actions/checkout@v4

      # mips/mipsel use nightly + rust-src to rebuild std from source
      # (`-Z build-std`, wired through GNUmakefile's BUILD_STD=yes) since
      # stable Rust no longer ships a prebuilt std for either target — so
      # there's no prebuilt target component to install for them at all.
      # Everything else keeps using the prebuilt std on stable. Two
      # separate steps rather than one with ternary expressions: GitHub
      # Actions expressions treat `''` as falsy, so `matrix.build_std &&
      # '' || matrix.rust_target` silently evaluates to `matrix.rust_target`
      # even when build_std is true — confirmed the hard way when that
      # exact expression made the nightly install still request the
      # target's (nonexistent) prebuilt std component.
      - name: Install Rust (stable, prebuilt std)
        if: ${{ !matrix.build_std }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Rust (nightly, build-std)
        if: ${{ matrix.build_std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      # cross-rs's last crates.io release (0.2.5, Feb 2023) doesn't
      # recognize riscv64gc-unknown-linux-musl as a valid target even with
      # a custom Cross.toml image override — it silently falls back to
      # building with the host linker, which fails ("Relocations in
      # generic ELF"). There's been no newer GitHub release since, so
      # `taiki-e/install-action` (which installs release binaries) can't
      # be used here; building from the git default branch is what
      # actually recognizes the target, verified locally.
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build packages
        run: |
          make package \
            CROSS_TARGET=${{ matrix.rust_target }} \
            ARCH=${{ matrix.arch }} \
            OPENWRT_ARCH=${{ matrix.openwrt_arch }} \
            BUILD_STD=${{ matrix.build_std && 'yes' || 'no' }}

      # Exercises both binaries' actual startup path under qemu-user
      # emulation (bundled in cross's images): `--rotate-apply` with a
      # nonexistent pwfile takes kestreld through real tokio runtime/timer
      # setup and a clean exit without touching any real router state;
      # `nft-resolve --help` is inherently side-effect-free. Skipped for
      # x86_64, which runs natively on the CI runner already.
      - name: Smoke test under QEMU emulation
        if: matrix.arch != 'x86_64'
        run: |
          make smoke-test \
            CROSS_TARGET=${{ matrix.rust_target }} \
            BUILD_STD=${{ matrix.build_std && 'yes' || 'no' }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          # actions/upload-artifact's glob has no brace-expansion support —
          # `*.{apk,ipk}` matches that literal string, not either
          # extension, and silently uploads nothing. List each pattern on
          # its own line instead.
          path: |
            target/pkg/*.apk
            target/pkg/*.ipk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    # Run even if mips/mipsel (or any other single leg) failed outright
    # rather than via continue-on-error — only skip this on a cancelled
    # run, so one bad architecture never blocks releasing the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List packages
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
