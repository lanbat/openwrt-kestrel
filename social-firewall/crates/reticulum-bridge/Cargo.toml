[package]
name = "reticulum-bridge"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kestrel-reticulum-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.10"
log = "0.4"
rand_core = "0.6"
reticulum = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs.git", rev = "c5e0a3c48eae948507c8b2b1a92599ddba7eedb6" }
tokio = { version = "1", features = ["macros", "net", "sync", "time", "signal", "fs", "rt-multi-thread"] }
