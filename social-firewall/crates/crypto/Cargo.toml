[package]
name = "crypto"
version.workspace = true
edition.workspace = true

[dependencies]
domain-types = { path = "../domain-types" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1"
crypto_box = { version = "0.9", features = ["seal", "std"] }
