[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
domain-types = { path = "../domain-types" }
crypto = { path = "../crypto" }
policy-engine = { path = "../policy-engine" }
state-store = { path = "../state-store" }
nft-enforcer = { path = "../nft-enforcer" }
wg-tunnel = { path = "../wg-tunnel" }
dashboard = { path = "../dashboard" }
p2p-transport = { path = "../p2p-transport" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
anyhow = "1"
rand = "0.8"
serde_urlencoded = "0.7"
shell-words = "1"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "rustls"] }
rustls = "0.23.43"
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
cucumber = "0.23"
fantoccini = { version = "0.22", default-features = false }
hyper-util = { version = "0.1", features = ["client", "http1", "client-legacy", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
tiny_http = "0.12"

[[test]]
name = "dashboard_browser"
path = "tests/dashboard_browser.rs"
harness = false

[[test]]
name = "chat_browser"
path = "tests/chat_browser.rs"
harness = false

[[test]]
name = "two_node_federation"
path = "tests/two_node_federation.rs"
harness = false
