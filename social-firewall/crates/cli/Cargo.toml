[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
domain-types = { path = "../domain-types" }
crypto = { path = "../crypto" }
policy-engine = { path = "../policy-engine" }
state-store = { path = "../state-store" }
nft-enforcer = { path = "../nft-enforcer" }
wg-tunnel = { path = "../wg-tunnel" }
dashboard = { path = "../dashboard" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
