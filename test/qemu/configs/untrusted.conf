# Test fixture for test/qemu/deploy.sh — not a real deployment config.
# Shares radio0 with guest.conf (a second SSID/BSS on the same physical
# radio — hostapd supports this natively, same as two networks on one real
# WiFi card). Safe to commit: no real WiFi network.

WIFI_KEY=testpassword123

IFACE=untrusted
RADIO=radio0
RADIO_EXTRA=
SSID=hwsim-test-untrusted
ENCRYPTION=psk2

SUBNET=192.168.4
RATE_LIMIT=500kbit
RATE_LIMIT_PER_DEVICE=
DNS_SERVER=1.1.1.1
IPV6=no
LAN_ACCESS=yes
ALLOWLIST=yes

ISOLATE=yes
DOT=no
ALLOWED_PORTS=
VLAN_ID=
VLAN_TRUNK=
NOTIFY_URL=
DEFAULT_DURATION=24h
MAX_DURATION=30d
REASON_REQUIRED=no
BANDWIDTH_THRESHOLD_MB=0
SHOW_QR=no
NOTIFY_JOIN=no
REJOIN_NOTIFY_AFTER=
JOIN_APPROVAL=yes
JOIN_HISTORY_RETENTION=90d
DEVICE_CONTROL=yes
ROTATE_PASSWORD=no
DESCRIPTION='IoT / untrusted hwsim test'
MDNS=no
