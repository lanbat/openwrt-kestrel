# Test fixture for test/qemu/deploy.sh — not a real deployment config.
# Safe to commit: no real WiFi network, just values proven to work against
# the hwsim radio0 set up by test/qemu/provision.sh.

WIFI_KEY=testpassword123

IFACE=guest
RADIO=radio0
RADIO_EXTRA=
SSID=hwsim-test-guest
ENCRYPTION=psk2                  # the wpa_supplicant build used by test/qemu/client.sh
                                  # doesn't support SAE/WPA3 — psk2 for testability, not a
                                  # statement about what you should run for real.

SUBNET=192.168.3
RATE_LIMIT=10mbit
RATE_LIMIT_PER_DEVICE=5mbit
DNS_SERVER=1.1.1.1
IPV6=no
LAN_ACCESS=no
ALLOWLIST=no

ISOLATE=yes
DOT=no
ALLOWED_PORTS=
VLAN_ID=
VLAN_TRUNK=
NOTIFY_URL=
DEFAULT_DURATION=24h
MAX_DURATION=30d
REASON_REQUIRED=no
BANDWIDTH_THRESHOLD_MB=0
SHOW_QR=yes
NOTIFY_JOIN=yes
REJOIN_NOTIFY_AFTER=
JOIN_APPROVAL=yes
JOIN_HISTORY_RETENTION=90d
ROTATE_PASSWORD=yes
DESCRIPTION='Guest WiFi hwsim test'
MDNS=no
ACCESS_HOURS=
